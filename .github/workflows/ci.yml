name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Nightly (03:00 JST): Windows, and the oracles that measure CI itself (LOOP-2). Not on pushes:
  # waiting for Windows on every PR cost more than it caught (the human's decision, 2026-10-03).
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
# Least privilege for every job: read the repository, nothing else (Codex audit #10). Third-party
# actions are pinned to full commit SHAs; the comment names the release the SHA is.
permissions:
  contents: read
jobs:
  # The `loop` job's oracles, split over parallel runners (scripts/shard.mjs; LOOP-2: a full run in
  # 10 minutes). Each shard runs its oracles one at a time, as a full run does, so an oracle with a
  # latency or Lighthouse threshold never shares its machine. A shard gives no verdict.
  loop-shard:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: loop-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      # STD-3 (pyauth, the non-JS implementation) and DIV-1 (the Python Diver) need CPython >= 3.11 on
      # the host; the Python packages themselves come hash-pinned from interop/py/requirements.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Scoreboard — shard ${{ matrix.shard }} of the loop job's oracles
        run: node scripts/scoreboard.mjs --base "origin/${{ github.base_ref || 'main' }}" --job loop --shard ${{ matrix.shard }}/4 --out shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "shard-${{ matrix.shard }}", path: "shard-${{ matrix.shard }}.json", if-no-files-found: error, retention-days: 7 }
  # The required check. It runs whatever the shards did (`always()`: a shard that crashed or never
  # uploaded is a missing shard, which fails the merge; a skipped job would count as green). Every
  # oracle of the job must come back exactly once, from this commit and this verifier; then the
  # ratchet, read from the base branch, judges as before.
  loop:
    needs: loop-shard
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # nothing to download is the merge's to report, by name
        with: { pattern: "shard-*", path: shards, merge-multiple: true }
      - name: Scoreboard — the shards merged, ratchet read from the base branch, so a PR cannot loosen it
        run: node scripts/scoreboard.mjs --base "origin/${{ github.base_ref || 'main' }}" --job loop --merge shards/shard-*.json
      - name: Verifier diff — the only part a human must read
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Verifier diff (accept/, docs/MISSION.md, scripts/, .github/, .claude/)"
            echo '```'
            git diff --stat "origin/${{ github.base_ref }}...HEAD" -- accept docs/MISSION.md scripts .github .claude || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # The oracles that need the preview (WEB-1), on the human's plan (2026-10-04, LOOP-2):
  #   - a push to main always deploys (the preview shows main); a pull request uploads a version only
  #     when it touches what the site is built from (site/changed.mjs), and leaves the live preview alone;
  #   - every version has its own preview URL that serves that build and nothing else, so the checks run
  #     against it while any other run deploys: no lock across jobs;
  #   - Lighthouse (about 9 minutes for every page, three runs each) is split over three runners, and the
  #     `preview` job judges WEB-1 from their results (site/test/web1-parts.mjs: every page exactly once,
  #     this build, this URL).
  # The token can edit Workers in the agent-only account and nothing else; the deploy refuses one that
  # reaches any other account (docs/DEPLOY.md §5).
  preview-changed:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - id: changed
        run: echo "run=$(node site/changed.mjs --event ${{ github.event_name }} --base origin/${{ github.base_ref || 'main' }})" >> "$GITHUB_OUTPUT"
  preview-deploy:
    needs: preview-changed
    if: needs.preview-changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Live deploys (pushes to main) one at a time, in order; a pull request's upload changes nothing live.
    concurrency: { group: "${{ github.event_name == 'push' && 'preview-live' || format('preview-upload-{0}', github.run_id) }}", cancel-in-progress: false }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy this checkout's site (a push) or upload it as a version (a pull request)
        run: node site/deploy.mjs ${{ github.event_name == 'pull_request' && '--upload-only' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: preview, path: "site/preview.json\nsite/dist", if-no-files-found: error, retention-days: 7 }
  preview-lighthouse:
    needs: preview-deploy
    name: preview-lighthouse (${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: preview, path: site }
      - name: WEB-1 Lighthouse, part ${{ matrix.part }} of 3, against the version's own URL
        env: { LUDION_SITE_DIST: site/dist, LUDION_WEB1_PART: "${{ matrix.part }}/3", LUDION_WEB1_OUT: "web1-part-${{ matrix.part }}.json" }
        run: node --test --test-reporter=tap --test-name-pattern "^WEB-1" site/test/web1.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: "web1-part-${{ matrix.part }}", path: "web1-part-${{ matrix.part }}.json", if-no-files-found: error, retention-days: 7 }
  # Judges WEB-1 whatever the parts did (a part that crashed is a missing part, which fails it), and
  # holds it to the ratchet read from the base branch, as `loop` does.
  preview:
    needs: [preview-changed, preview-deploy, preview-lighthouse]
    if: always() && needs.preview-changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # nothing to download is WEB-1's to report
        with: { name: preview, path: site }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: { pattern: "web1-part-*", path: web1-parts, merge-multiple: true }
      - name: Scoreboard — the preview job's oracles, from the parts, ratchet from the base branch
        env: { LUDION_SITE_DIST: site/dist, LUDION_WEB1_PARTS: web1-parts }
        run: node scripts/scoreboard.mjs --base "origin/${{ github.base_ref || 'main' }}" --job preview
  # MCP-1/MCP-2: a real authorization server (Keycloak, CIMD on) authorizes an agent by its card URL.
  # Its own job, in parallel, outside LOOP-2's 10 minutes (the human's decision, 2026-10-03): Java
  # and Keycloak take a while to start. Keycloak's zip is checked against a pinned SHA-256.
  mcp:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUDION_TOOLS: ${{ github.workspace }}/../ludion-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: "${{ github.workspace }}/../ludion-tools", key: "keycloak-${{ hashFiles('accept/mcp/keycloak.mjs') }}" }
      - run: npm ci
      - name: Keycloak (pinned version and SHA-256)
        run: node accept/mcp/fetch-keycloak.mjs
      - name: Scoreboard — the mcp job's oracles, ratchet from the base branch
        run: node scripts/scoreboard.mjs --base "origin/${{ github.base_ref || 'main' }}" --job mcp
  # The same loop on the platform the agent actually runs on, nightly on main. Caught before: the
  # Node ≥23 test reporter, Windows path separators, EXDEV and EPERM renames, SQLite's busy wait.
  # A red night is fixed first (the human's rule, 2026-10-03).
  nightly-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      # STD-3 (pyauth, the non-JS implementation) and DIV-1 (the Python Diver) need CPython >= 3.11 on
      # the host; the Python packages themselves come hash-pinned from interop/py/requirements.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: npm ci
      - run: node scripts/scoreboard.mjs --base origin/main --job loop
  # Oracles about CI itself (LOOP-2 reads main's latest push run). Nightly, never in a PR's run:
  # a PR cannot change the run main already had, and a slow main must not block its own fix.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node scripts/scoreboard.mjs --base origin/main --job nightly
